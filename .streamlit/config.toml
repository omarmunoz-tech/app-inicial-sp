# Colores y tipografía de la app. Streamlit lee este archivo al abrir la app.
# Cambia los colores para darle a la app su propio estilo. Los colores van en
# formato hexadecimal (por ejemplo "#2563eb"); cualquier selector de colores los da.
# Después de cambiar este archivo, detén la app en Thonny y vuelve a ejecutarla.

[theme]
# "light" para fondo claro o "dark" para fondo oscuro
base = "light"
# Color principal: botones, enlaces y la página activa del menú
primaryColor = "#2563eb"
# Color de las gráficas (puede ser una lista de varios colores)
chartCategoricalColors = ["#2563eb"]
# Fondo de la página
backgroundColor = "#ffffff"
# Fondo de la barra lateral y de los recuadros
secondaryBackgroundColor = "#f1f5f9"
# Color del texto
textColor = "#0f172a"
# Tipografía del texto y de los títulos (cualquier familia de Google Fonts)
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
